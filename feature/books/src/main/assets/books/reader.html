<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Книга</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  foliate-view { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<foliate-view id="view"></foliate-view>
<script type="module">
import './foliate-js/view.js'
import { Overlayer } from './foliate-js/overlayer.js'

const view = document.getElementById('view')
const bridge = window.AndroidBridge

let style = {
    bg: '#ffffff',
    fg: '#1b1b1b',
    fontSize: 100,
    spacing: 1.6,
    justify: true,
    hyphenate: true,
}

const getCSS = ({ bg, fg, fontSize, spacing, justify, hyphenate }) => `
    @namespace epub "http://www.idpf.org/2007/ops";
    html { color-scheme: light dark; background: ${bg}; }
    body { background: ${bg} !important; color: ${fg} !important; }
    html { font-size: ${fontSize}% !important; }
    p, li, blockquote, dd {
        line-height: ${spacing};
        text-align: ${justify ? 'justify' : 'start'};
        -webkit-hyphens: ${hyphenate ? 'auto' : 'manual'};
        hyphens: ${hyphenate ? 'auto' : 'manual'};
        -webkit-hyphenate-limit-before: 3;
        -webkit-hyphenate-limit-after: 2;
        widows: 2;
    }
    [align="left"] { text-align: left; }
    [align="center"] { text-align: center; }
    [align="justify"] { text-align: justify; }
    a:link { color: #4a6da7; }
    pre { white-space: pre-wrap !important; }
`

function applyStyle() {
    try { view.renderer && view.renderer.setStyles && view.renderer.setStyles(getCSS(style)) } catch (e) { console.error(e) }
}

function b64ToText(b64) {
    return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)))
}

// ===== Аннотации: реестр по секциям (пере-отрисовка при загрузке секции) =====
const sectionAnnotations = new Map()
const annotationsByValue = new Map()

view.addEventListener('create-overlay', e => {
    const { index } = e.detail
    const list = sectionAnnotations.get(index)
    if (list) for (const annotation of list) view.addAnnotation(annotation)
})

view.addEventListener('draw-annotation', e => {
    const { draw, annotation } = e.detail
    draw(Overlayer.highlight, { color: annotation.color })
})

view.addEventListener('show-annotation', e => {
    bridge && bridge.onAnnotationTapped(e.detail.value)
})

// Захват выделения текста → CFI для создания аннотации
view.addEventListener('load', ({ detail }) => {
    applyStyle()
    const { doc, index } = detail
    if (!doc) return
    doc.addEventListener('pointerup', function () {
        setTimeout(function () {
            try {
                const sel = doc.getSelection()
                if (!sel || sel.isCollapsed || !sel.rangeCount) return
                const range = sel.getRangeAt(0)
                const cfi = view.getCFI(index, range)
                const text = sel.toString()
                if (cfi && text.trim()) {
                    bridge && bridge.onSelection(JSON.stringify({ cfi: cfi, text: text.slice(0, 200) }))
                }
            } catch (e) { console.error(e) }
        }, 50)
    })
})

view.addEventListener('relocate', e => {
    const d = e.detail
    if (!bridge) return
    bridge.onRelocate(JSON.stringify({
        fraction: d.fraction ?? 0,
        index: d.index ?? 0,
        chapter: (d.tocItem && d.tocItem.label) ? d.tocItem.label : '',
        page: (d.pageItem && d.pageItem.label) ? d.pageItem.label : '',
    }))
})

// ===== FB2 → EPUB (собственная конвертация; fb2.js foliate обходим) =====

function crc32(bytes) {
    let table = crc32.table
    if (!table) {
        table = crc32.table = new Int32Array(256)
        for (let n = 0; n < 256; n++) {
            let c = n
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1)
            table[n] = c
        }
    }
    let crc = -1
    for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF]
    return (crc ^ -1) >>> 0
}

function makeStoreZip(files) {
    const enc = new TextEncoder()
    const chunks = []
    const central = []
    let offset = 0
    const now = new Date()
    const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() / 2) & 31)
    const dosDate = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31)
    for (const f of files) {
        const nameB = enc.encode(f.name)
        const crc = crc32(f.data)
        const lh = new DataView(new ArrayBuffer(30))
        lh.setUint32(0, 0x04034b50, true)
        lh.setUint16(4, 20, true)
        lh.setUint16(6, 0x0800, true)
        lh.setUint16(8, 0, true)
        lh.setUint16(10, dosTime, true)
        lh.setUint16(12, dosDate, true)
        lh.setUint32(14, crc, true)
        lh.setUint32(18, f.data.length, true)
        lh.setUint32(22, f.data.length, true)
        lh.setUint16(26, nameB.length, true)
        lh.setUint16(28, 0, true)
        chunks.push(new Uint8Array(lh.buffer), nameB, f.data)
        const ch = new DataView(new ArrayBuffer(46))
        ch.setUint32(0, 0x02014b50, true)
        ch.setUint16(4, 20, true)
        ch.setUint16(6, 20, true)
        ch.setUint16(8, 0x0800, true)
        ch.setUint16(12, dosTime, true)
        ch.setUint16(14, dosDate, true)
        ch.setUint32(16, crc, true)
        ch.setUint32(20, f.data.length, true)
        ch.setUint32(24, f.data.length, true)
        ch.setUint16(28, nameB.length, true)
        ch.setUint32(42, offset, true)
        central.push(new Uint8Array(ch.buffer), nameB)
        offset += 30 + nameB.length + f.data.length
    }
    const cdStart = offset
    let cdSize = 0
    for (const c of central) cdSize += c.length
    const eocd = new DataView(new ArrayBuffer(22))
    eocd.setUint32(0, 0x06054b50, true)
    eocd.setUint16(8, files.length, true)
    eocd.setUint16(10, files.length, true)
    eocd.setUint32(12, cdSize, true)
    eocd.setUint32(16, cdStart, true)
    const out = new Uint8Array(cdStart + cdSize + 22)
    let pos = 0
    for (const c of [...chunks, ...central]) { out.set(c, pos); pos += c.length }
    out.set(new Uint8Array(eocd.buffer), pos)
    return out
}

function fb2Esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

function fb2ToChapters(doc) {
    const binaries = {}
    for (const b of doc.getElementsByTagName('binary')) {
        const id = b.getAttribute('id')
        const ct = b.getAttribute('content-type') || 'image/png'
        const text = (b.textContent || '').replace(/\s+/g, '')
        if (id && text.length && text.length <= 8 * 1024 * 1024) binaries[id] = 'data:' + ct + ';base64,' + text
    }
    function xlinkHref(el) {
        return el.getAttributeNS('http://www.w3.org/1999/xlink', 'href')
            || el.getAttribute('href') || ''
    }
    function renderInline(node, out) {
        for (const child of node.childNodes) {
            if (child.nodeType === 3) { out.push(fb2Esc(child.nodeValue || '')); continue }
            if (child.nodeType !== 1) continue
            const name = child.localName
            if (name === 'strong') { out.push('<strong>'); renderInline(child, out); out.push('</strong>') }
            else if (name === 'emphasis') { out.push('<em>'); renderInline(child, out); out.push('</em>') }
            else if (name === 'strikethrough') { out.push('<s>'); renderInline(child, out); out.push('</s>') }
            else if (name === 'sub') { out.push('<sub>'); renderInline(child, out); out.push('</sub>') }
            else if (name === 'sup') { out.push('<sup>'); renderInline(child, out); out.push('</sup>') }
            else if (name === 'code') { out.push('<code>'); renderInline(child, out); out.push('</code>') }
            else if (name === 'style') { out.push('<span>'); renderInline(child, out); out.push('</span>') }
            else if (name === 'a') { out.push('<a href="' + fb2Esc(xlinkHref(child)) + '">'); renderInline(child, out); out.push('</a>') }
            else if (name === 'image') {
                const src = binaries[xlinkHref(child).replace(/^#/, '')]
                if (src) out.push('<img alt="" src="' + src + '">')
            }
            else if (name === 'br') out.push('<br>')
            else renderInline(child, out)
        }
    }
    function renderBlock(node, out) {
        const name = node.localName
        if (name === 'title') {
            out.push('<h2>')
            for (const p of node.getElementsByTagName('p')) {
                const t = []
                renderInline(p, t)
                out.push(fb2Esc(t.join('').trim()) + '<br>')
            }
            out.push('</h2>')
        } else if (name === 'subtitle') {
            out.push('<h3>'); renderInline(node, out); out.push('</h3>')
        } else if (name === 'p') {
            out.push('<p>'); renderInline(node, out); out.push('</p>')
        } else if (name === 'empty-line') {
            out.push('<br>')
        } else if (name === 'poem' || name === 'cite' || name === 'epigraph') {
            out.push('<blockquote>')
            for (const c of node.children) renderBlock(c, out)
            out.push('</blockquote>')
        } else if (name === 'stanza') {
            for (const v of node.getElementsByTagName('v')) {
                out.push('<p style="margin-left:2em">')
                renderInline(v, out)
                out.push('</p>')
            }
        } else if (name === 'table') {
            out.push('<table>')
            for (const tr of node.getElementsByTagName('tr')) {
                out.push('<tr>')
                for (const td of tr.children) {
                    out.push('<td>')
                    for (const p of td.getElementsByTagName('p')) {
                        const t = []
                        renderInline(p, t)
                        out.push(fb2Esc(t.join('')))
                    }
                    out.push('</td>')
                }
                out.push('</tr>')
            }
            out.push('</table>')
        } else if (name === 'v') {
            out.push('<p style="margin-left:2em">')
            renderInline(node, out)
            out.push('</p>')
        } else {
            const t = []
            renderInline(node, t)
            const txt = t.join('').trim()
            if (txt) out.push('<p>' + txt + '</p>')
        }
    }
    const bodies = [...doc.getElementsByTagName('body')]
    const mainBody = bodies.find(b => {
        const n = b.getAttribute('name')
        return !n || n === 'main'
    }) || bodies[0]
    if (!mainBody) return null
    const titleEl = doc.querySelector('title-info book-title')
    const title = ((titleEl && titleEl.textContent) || '').trim() || 'FB2'
    const blocks = [...mainBody.children].filter(n => n.nodeType === 1)
    const chapters = []
    const secEls = blocks.filter(n => n.localName === 'section')
    const renderSection = (sec, out) => {
        const t = [...sec.children].find(c => c.localName === 'title')
        if (t) renderBlock(t, out)
        for (const c of sec.children) {
            if (c === t) continue
            if (c.localName === 'section') renderSection(c, out)
            else renderBlock(c, out)
        }
    }
    if (secEls.length) {
        for (const sec of secEls) {
            const out = []
            renderSection(sec, out)
            chapters.push(out.join('\n'))
        }
    } else {
        const out = []
        for (const c of blocks) renderBlock(c, out)
        chapters.push(out.join('\n'))
    }
    return { title: title, chapters: chapters }
}

function fb2ToEpub(fb) {
    const enc = new TextEncoder()
    const xhtml = body => '<?xml version="1.0" encoding="utf-8"?>\n' +
        '<html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="utf-8"/>' +
        '<title>' + fb2Esc(fb.title) + '</title>' +
        '<style>body{margin:0;padding:1em;line-height:1.55}img{max-width:100%}</style>' +
        '</head><body>' + body + '</body></html>'
    const files = [{ name: 'mimetype', data: enc.encode('application/epub+zip') }]
    files.push({
        name: 'META-INF/container.xml',
        data: enc.encode('<?xml version="1.0"?><container version="1.0" ' +
            'xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles>' +
            '<rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>' +
            '</rootfiles></container>'),
    })
    const manifest = []
    const spine = []
    const navMap = []
    fb.chapters.forEach((ch, i) => {
        const id = 'ch' + (i + 1)
        const href = 'chapter' + (i + 1) + '.xhtml'
        manifest.push('<item id="' + id + '" href="' + href + '" media-type="application/xhtml+xml"/>')
        spine.push('<itemref idref="' + id + '"/>')
        files.push({ name: 'OEBPS/' + href, data: enc.encode(xhtml(ch)) })
        navMap.push('<navPoint id="n' + (i + 1) + '" playOrder="' + (i + 1) + '">' +
            '<navLabel><text>' + fb2Esc(fb.title) + ' — ' + (i + 1) + '</text></navLabel>' +
            '<content src="' + href + '"/></navPoint>')
    })
    const uid = 'urn:uuid:' + (crypto.randomUUID ? crypto.randomUUID() : Date.now())
    files.push({
        name: 'OEBPS/content.opf',
        data: enc.encode('<?xml version="1.0" encoding="utf-8"?>' +
            '<package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="uid">' +
            '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">' +
            '<dc:title>' + fb2Esc(fb.title) + '</dc:title>' +
            '<dc:language>ru</dc:language>' +
            '<dc:identifier id="uid">' + fb2Esc(uid) + '</dc:identifier>' +
            '</metadata>' +
            '<manifest><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>' +
            manifest.join('') + '</manifest>' +
            '<spine toc="ncx">' + spine.join('') + '</spine></package>'),
    })
    files.push({
        name: 'OEBPS/toc.ncx',
        data: enc.encode('<?xml version="1.0" encoding="utf-8"?>' +
            '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">' +
            '<head><meta name="dtb:uid" content="' + fb2Esc(uid) + '"/></head>' +
            '<docTitle><text>' + fb2Esc(fb.title) + '</text></docTitle>' +
            '<navMap>' + navMap.join('') + '</navMap></ncx>'),
    })
    return makeStoreZip(files)
}

window.reader = {
    async open(url) {
        try {
            let input = url
            // FB2 в дикой природе: cp1251, koi8, utf-16, BOM, кривые декларации.
            // foliate по одной декларации угадывает плохо и молча даёт пустую книгу.
            // Сами ищем кодировку, при которой XML реально парсится в FictionBook.
            try {
                const res = await fetch(url)
                if (res.ok) {
                    const buf = await res.arrayBuffer()
                    console.info('[fb2] fetched ' + buf.byteLength + ' bytes')
                    const head = new Uint8Array(buf, 0, Math.min(4, buf.byteLength))
                    const isZip = head[0] === 0x50 && head[1] === 0x4B
                    const isPdf = head[0] === 0x25 && head[1] === 0x50
                    if (!isZip && !isPdf && /\.(fb2|fbz)$/i.test(url)) {
                        const bytes = new Uint8Array(buf)
                        const bom = (bytes[0] === 0xFF && bytes[1] === 0xFE) ? 'utf-16le'
                            : (bytes[0] === 0xFE && bytes[1] === 0xFF) ? 'utf-16be'
                            : (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) ? 'utf-8' : null
                        const headStr = new TextDecoder('utf-8').decode(bytes.subarray(0, 512))
                        const decl = headStr.match(/<\?xml\s+version\s*=\s*["']1\.\d+["']\s+encoding\s*=\s*["']([A-Za-z0-9._-]+)["']/i)?.[1]
                        const candidates = []
                        if (bom) candidates.push(bom)
                        if (decl) candidates.push(decl.toLowerCase())
                        for (const c of ['utf-8', 'windows-1251', 'koi8-r', 'iso-8859-5', 'utf-16le', 'utf-16be']) {
                            if (!candidates.includes(c)) candidates.push(c)
                        }
                        let best = null
                        let bestDoc = null
                        for (const enc of candidates) {
                            try {
                                const text = new TextDecoder(enc).decode(bytes).replace(/^\uFEFF/, '')
                                const doc = new DOMParser().parseFromString(text, 'application/xml')
                                if (!doc.querySelector('parsererror') &&
                                    doc.documentElement && doc.documentElement.localName.toLowerCase() === 'fictionbook') {
                                    best = text
                                    bestDoc = doc
                                    console.info('[fb2] decode ok via ' + enc)
                                    break
                                }
                            } catch (e) { console.warn('[fb2] decode fail ' + enc + ': ' + e) }
                        }
                        if (!best || !bestDoc) {
                            console.error('[fb2] ни одна кодировка не дала валидный XML')
                            bridge && bridge.onError('FB2: файл не распознан как валидный FictionBook XML')
                            return 'error'
                        }
                        // Своя конвертация fb2 → EPUB: fb2.js foliate обходим целиком
                        // (там бывали и пустые книги, и зависания — белый экран).
                        try {
                            const fb = fb2ToChapters(bestDoc)
                            if (!fb || !fb.chapters.length || fb.chapters.every(c => !c.trim())) {
                                bridge && bridge.onError('FB2: в файле нет тела книги (body/section)')
                                return 'error'
                            }
                            const epub = fb2ToEpub(fb)
                            console.info('[fb2] epub built: chapters=' + fb.chapters.length +
                                ', bytes=' + epub.length)
                            input = new File([epub], 'book.epub', { type: 'application/epub+zip' })
                        } catch (e) {
                            console.error('[fb2] convert failed:', e)
                            bridge && bridge.onError('FB2: ошибка конвертации — ' + e)
                            return 'error'
                        }
                    }
                } else {
                    console.error('[fb2] fetch ' + res.status)
                }
            } catch (e) { console.error('fb2 preopen:', e) }
            // ВАЖНО: view.open() не возвращает книгу — она попадает в view.book
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject(new Error('Книга не открылась (таймаут)')), 25000))
            await Promise.race([view.open(input), timeout])
            const book = view.book
            if (!book) throw new Error('Книга не открылась (view.book пуст)')
            if (book.sections && book.sections.length === 0) {
                throw new Error('Книга открылась без содержимого (0 секций)')
            }
            console.info('[books] opened: sections=' +
                (book.sections ? book.sections.length : '?') + ', toc=' + (book.toc ? book.toc.length : 'null'))
            applyStyle()
            if (book.toc) {
                const flat = []
                const walk = (items, level) => {
                    for (const it of items || []) {
                        flat.push({ label: it.label ?? '', href: it.href ?? '', level })
                        if (it.subitems) walk([...it.subitems], level + 1)
                    }
                }
                walk(book.toc, 0)
                bridge && bridge.onToc(JSON.stringify(flat))
            }
            bridge && bridge.onLoaded()
            return 'ok'
        } catch (e) {
            bridge && bridge.onError(String((e && e.message) || e))
            return 'error'
        }
    },
    goToFraction(f) { view.goToFraction(f) },
    goTo(href) { const p = view.goTo(href); if (p && p.catch) p.catch(() => {}) },
    next() { view.next() },
    prev() { view.prev() },
    setStyle(json) { style = Object.assign({}, style, JSON.parse(json)); applyStyle() },
    setFlow(flow) { try { view.renderer && view.renderer.setAttribute && view.renderer.setAttribute('flow', flow) } catch (e) { console.error(e) } },
    addHighlight(cfiB64, color) {
        return (async () => {
            try {
                const cfi = b64ToText(cfiB64)
                const annotation = { value: cfi, color: color || 'yellow' }
                const res = await view.addAnnotation(annotation)
                const index = res && res.index
                const list = sectionAnnotations.get(index) || []
                list.push(annotation)
                sectionAnnotations.set(index, list)
                annotationsByValue.set(cfi, annotation)
                return 'ok'
            } catch (e) { return 'error: ' + String((e && e.message) || e) }
        })()
    },
    removeHighlight(cfiB64) {
        return (async () => {
            try {
                const cfi = b64ToText(cfiB64)
                const annotation = annotationsByValue.get(cfi)
                if (annotation) await view.deleteAnnotation(annotation)
                annotationsByValue.delete(cfi)
                for (const [index, list] of sectionAnnotations) {
                    sectionAnnotations.set(index, list.filter(a => a.value !== cfi))
                }
                return 'ok'
            } catch (e) { return 'error: ' + String((e && e.message) || e) }
        })()
    },
    search(query) {
        (async () => {
            try {
                for await (const result of view.search({ query })) {
                    if (result === 'done') {
                        bridge && bridge.onSearch(JSON.stringify({ done: true }))
                    } else if (result.progress != null) {
                        bridge && bridge.onSearch(JSON.stringify({ progress: result.progress }))
                    } else if (result.subitems) {
                        bridge && bridge.onSearch(JSON.stringify({
                            label: result.label || '',
                            subitems: (result.subitems || []).map(function (s) {
                                return { cfi: s.cfi, pre: s.excerpt.pre, match: s.excerpt.match, post: s.excerpt.post }
                            })
                        }))
                    } else if (result.cfi) {
                        bridge && bridge.onSearch(JSON.stringify({
                            cfi: result.cfi,
                            pre: result.excerpt.pre,
                            match: result.excerpt.match,
                            post: result.excerpt.post
                        }))
                    }
                }
            } catch (e) {
                bridge && bridge.onSearch(JSON.stringify({ error: String((e && e.message) || e) }))
            }
        })()
    },
    clearSearch() { try { view.clearSearch() } catch (e) { console.error(e) } },
    goToCfi(cfi) { const p = view.goTo('foliate-search:' + cfi); if (p && p.catch) p.catch(function () {}) },
    goToRaw(cfi) { const p = view.goTo(cfi); if (p && p.catch) p.catch(function () {}) },
}

bridge && bridge.onPageReady()
</script>
</body>
</html>
